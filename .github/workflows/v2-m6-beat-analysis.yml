name: V2 M6 Beat analysis validation

on:
  push:
    branches:
      - impl-m6-beat-analysis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-beat-analysis:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
      FAM_STEP11_NO_RECOVERY_PROMPT: '1'

    steps:
      - name: Checkout M6 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Q0 compile
        run: |
          python -m compileall -q src \
            tests/test_v2_feature_parity_registry.py \
            tests/test_v2_app_kernel.py \
            tests/test_v2_task_lifecycle.py \
            tests/test_v2_project_persistence.py \
            tests/test_v2_render_engine.py \
            tests/test_v2_media_services.py \
            tests/test_v2_beat_analysis.py

      - name: Q0 M0 through M6 contracts
        run: |
          python -m pytest -q \
            tests/test_v2_feature_parity_registry.py \
            tests/test_v2_app_kernel.py \
            tests/test_v2_task_lifecycle.py \
            tests/test_v2_project_persistence.py \
            tests/test_v2_render_engine.py \
            tests/test_v2_media_services.py \
            tests/test_v2_beat_analysis.py \
            tests/test_editor_v2_main_entrypoint.py

      - name: Q1 beat and Spectrum parity
        run: |
          python -m pytest -q \
            tests/test_step08_spectrum_model.py \
            tests/test_step08_spectrum_render.py \
            tests/test_step08_spectrum_preview_async.py \
            tests/test_step08_spectrum_failure.py \
            tests/test_editor_v2_s11_spectrum_free_audio.py

      - name: Q1 Accurate Preview and render parity
        run: |
          python -m pytest -q \
            tests/test_editor_v2_preview_parity.py \
            tests/test_v2_render_engine.py

      - name: Q1 persistence and production shell
        run: |
          python -m pytest -q \
            tests/test_v2_project_persistence.py \
            tests/test_step11_production_integration.py::test_step11_production_shell_uses_one_state_and_canonical_save \
            tests/test_step11_e2e.py::test_nine_workspace_navigation_is_read_only_in_production_subprocess

      - name: Q1 200-song long-album structural stress
        run: |
          python -m pytest -q \
            tests/test_editor_v2_s12_performance.py::test_packed_200_song_three_hour_project_resolves_and_externalizes_graph \
            tests/test_editor_v2_s12_performance.py::test_free_200_song_three_hour_project_resolves_and_uses_bounded_command

  real-ffmpeg-m6:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock

    steps:
      - name: Checkout M6 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install targeted FFmpeg and Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Q1 real FFmpeg beat fallback and preview render parity
        timeout-minutes: 6
        run: |
          python -m pytest -q \
            tests/test_v2_beat_analysis.py::test_real_ffmpeg_detects_pulses_without_mutating_master_audio \
            tests/test_v2_beat_analysis.py::test_real_ffmpeg_silence_stays_non_reactive \
            tests/test_editor_v2_render.py::test_real_ffmpeg_two_song_background_text_and_accurate_preview \
            tests/test_editor_v2_s05_spectrum.py::test_real_silence_spectrum_and_accurate_preview_use_same_compiler
