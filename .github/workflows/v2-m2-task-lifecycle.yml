name: V2 M2 Task lifecycle validation

on:
  push:
    branches:
      - impl-m2-task-lifecycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m2-task-lifecycle:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: '1'
      PYTHONUNBUFFERED: '1'
      FAM_DISABLE_TEMPLATE_THUMBNAIL_RENDER: '1'
      FAM_STEP09_PROVIDER: mock
      FAM_STEP11_NO_RECOVERY_PROMPT: '1'

    steps:
      - name: Checkout M2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Q0 compile
        run: python -m compileall -q src tests/test_v2_feature_parity_registry.py tests/test_v2_app_kernel.py tests/test_v2_task_lifecycle.py

      - name: Q0 M0 + M1 + M2 contracts
        run: python -m pytest -q tests/test_v2_feature_parity_registry.py tests/test_v2_app_kernel.py tests/test_v2_task_lifecycle.py tests/test_editor_v2_main_entrypoint.py

      - name: Q1 legacy async stale guards
        run: python -m pytest -q tests/test_async_import.py tests/test_step09_async_provider.py::test_newer_provider_result_wins_and_stale_completion_is_discarded tests/test_step09_async_provider.py::test_cancel_invalidates_inflight_result_without_emitting_failure

      - name: Q1 render and close lifecycle characterization
        run: python -m pytest -q tests/test_render_lifecycle.py::test_pending_cancel_is_seen_before_renderer_starts_work tests/test_render_lifecycle.py::test_close_during_render_requests_cancel_and_defers_close tests/test_step11_close_lifecycle.py::test_step11_close_cancel_keeps_window_open_without_legacy_prompt

      - name: Q1 nine-workspace launch characterization
        run: python -m pytest -q tests/test_step11_e2e.py::test_nine_workspace_navigation_is_read_only_in_production_subprocess

      - name: Q1 authoritative-state production shell
        run: python -m pytest -q tests/test_step11_production_integration.py::test_step11_production_shell_uses_one_state_and_canonical_save
