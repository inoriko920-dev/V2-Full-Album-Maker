name: Build Windows Portable

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Read canonical release manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content build/release_manifest.json -Raw | ConvertFrom-Json
          "python=$($manifest.python.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($manifest.target_stable_version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ steps.manifest.outputs.python }}

      - name: Build and smoke exact Windows portable candidate
        shell: pwsh
        run: ./build/build_portable.ps1

      - name: Upload validation artifact only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Full-Album-Maker-Windows-Portable
          path: |
            Full-Album-Maker-v*-Windows-Portable.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Stable publication is intentionally disabled here
        shell: pwsh
        run: |
          Write-Host "Build workflow validates artifacts only."
          Write-Host "Stable GitHub Release publication belongs to the separate Q5-approved candidate workflow."
