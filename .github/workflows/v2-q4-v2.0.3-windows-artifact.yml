name: V2 Q4 Patch v2.0.3 Windows Artifact Quality Gate

on:
  push:
    branches:
      - release/q4-v2.0.3
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-q4-v2.0.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-artifact-q4:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
      FAM_STEP09_PROVIDER: mock
      FAM_STEP11_NO_RECOVERY_PROMPT: '1'

    steps:
      - name: Checkout exact Q4 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Read canonical release manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content build/release_manifest.json -Raw | ConvertFrom-Json
          "python=$($manifest.python.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($manifest.target_stable_version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ffmpeg_sha=$($manifest.ffmpeg.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ffmpeg_asset=$($manifest.ffmpeg.asset_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up exact Windows Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ steps.manifest.outputs.python }}

      - name: Q4 pre-build release metadata and publication safety gate
        shell: pwsh
        run: |
          @'
          import json
          import re
          from pathlib import Path

          root = Path(".")
          manifest = json.loads((root / "build/release_manifest.json").read_text(encoding="utf-8"))
          version = manifest["target_stable_version"]
          assert version == "2.0.3", "Q4 ini khusus patch v2.0.3"
          notes = (root / "docs/RELEASE_NOTES_v2.0.3.md").read_text(encoding="utf-8")
          assert "Status: **Release candidate — not published**" in notes
          assert "Q4 and Q5 pending" in notes
          init_text = (root / "src/full_album_maker/__init__.py").read_text(encoding="utf-8")
          pyproject = (root / "pyproject.toml").read_text(encoding="utf-8")
          lock = (root / "build/requirements-windows.lock").read_text(encoding="utf-8")
          notices = (root / "THIRD_PARTY_NOTICES.md").read_text(encoding="utf-8")
          build_ps1 = (root / "build/build_portable.ps1").read_text(encoding="utf-8")
          build_workflow = (root / ".github/workflows/build-windows-portable.yml").read_text(encoding="utf-8")

          assert f'__version__ = "{version}"' in init_text
          assert re.search(rf'^version\s*=\s*"{re.escape(version)}"\s*$', pyproject, re.M)

          packages = manifest["python_packages"]
          mapping = {
              "PySide6": "PySide6",
              "PySide6_Addons": "PySide6_Addons",
              "PySide6_Essentials": "PySide6_Essentials",
              "shiboken6": "shiboken6",
              "pytest": "pytest",
              "pyinstaller": "pyinstaller",
              "pillow": "pillow",
          }
          for key, lock_name in mapping.items():
              expected = f"{lock_name}=={packages[key]}"
              assert expected.lower() in lock.lower(), (key, expected)

          ffmpeg = manifest["ffmpeg"]
          for value in (
              ffmpeg["provider"],
              ffmpeg["release_tag"],
              ffmpeg["asset_name"],
              ffmpeg["sha256"],
              str(ffmpeg["release_id"]),
              str(ffmpeg["asset_id"]),
          ):
              assert str(value) in notices, value

          font = manifest["font"]
          assert font["commit"] in notices
          assert packages["PySide6"] in notices

          assert "release_manifest.json" in build_ps1
          assert "target_stable_version" in build_ps1
          assert "gh release create" not in build_workflow
          assert "contents: write" not in build_workflow
          assert "contents: read" in build_workflow
          print("Q4_RELEASE_METADATA_AND_PUBLICATION_SAFETY_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Q4 metadata/publication safety gate gagal." }

      - name: Build and smoke exact Windows portable candidate
        shell: pwsh
        run: ./build/build_portable.ps1

      - name: Re-prove pinned Windows FFmpeg external filter script capability
        shell: pwsh
        run: |
          $ffDir = (Resolve-Path 'tools\ffmpeg').Path
          $env:PATH = "$ffDir;$env:PATH"
          & 'tools\ffmpeg\ffmpeg.exe' -version | Select-Object -First 1
          python -m pytest -q tests/test_editor_v2_s12_performance.py::test_real_ffmpeg_accepts_external_filter_script
          if ($LASTEXITCODE -ne 0) { throw "Pinned Windows FFmpeg gagal pada -/filter_complex." }

      - name: Q4 secret scan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force q4-artifact-evidence | Out-Null
          @'
          import re
          from pathlib import Path

          patterns = {
              "PRIVATE_KEY": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "GITHUB_TOKEN": re.compile(r"gh[pousr]_[A-Za-z0-9]{36,255}"),
              "GOOGLE_API_KEY": re.compile(r"AIza[0-9A-Za-z_-]{35}"),
              "OPENAI_LIKE_KEY": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
          }
          hits = []
          for root in (Path("src"), Path("tests"), Path("docs"), Path("build")):
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  for line_no, line in enumerate(text.splitlines(), 1):
                      for kind, pattern in patterns.items():
                          if pattern.search(line):
                              hits.append((str(path), line_no, kind))
          if hits:
              raise SystemExit(f"Secret scan gagal: {hits[:10]}")
          Path("q4-artifact-evidence/secret-scan.txt").write_text("PASS\n", encoding="utf-8")
          print("Q4_SECRET_SCAN_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Q4 secret scan gagal." }

      - name: Validate exact ZIP identity, extracted contents, capabilities and notices
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path(".")
          manifest = json.loads((root / "build/release_manifest.json").read_text(encoding="utf-8"))
          version = manifest["target_stable_version"]
          assert version == "2.0.3"
          zip_name = manifest["artifact"]["zip_pattern"].replace("{version}", version)
          zip_path = root / zip_name
          checksum_path = root / manifest["artifact"]["checksum_file"]
          assert zip_path.is_file() and zip_path.stat().st_size > 1_000_000, (zip_path, zip_path.stat().st_size if zip_path.exists() else 0)

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          expected_line = f"{zip_sha}  {zip_name}"
          assert checksum_path.read_text(encoding="ascii").strip() == expected_line

          smoke_roots = [p for p in root.glob("portable smoke*") if p.is_dir()]
          assert smoke_roots, "Extracted Unicode/apostrophe smoke root tidak ditemukan."
          extracted = smoke_roots[0]
          exe = next(extracted.rglob("Full Album Maker.exe"), None)
          assert exe is not None

          app_root = exe.parent
          required = (
              "CAPABILITIES.json",
              "RELEASE_MANIFEST.json",
              "THIRD_PARTY_NOTICES.md",
              "LICENSE.txt",
              "assets/fonts/NotoSans.ttf",
              "assets/fonts/NotoSans-OFL.txt",
              "tools/ffmpeg/ffmpeg.exe",
              "tools/ffmpeg/ffprobe.exe",
              "temp/portable-smoke.json",
          )
          for rel in required:
              path = app_root / Path(rel)
              assert path.is_file(), rel

          capabilities = json.loads((app_root / "CAPABILITIES.json").read_text(encoding="utf-8"))
          bundled_manifest = json.loads((app_root / "RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          smoke = json.loads((app_root / "temp/portable-smoke.json").read_text(encoding="utf-8"))
          notices = (app_root / "THIRD_PARTY_NOTICES.md").read_text(encoding="utf-8")

          assert bundled_manifest == manifest
          assert capabilities["app_version"] == version
          assert capabilities["release_tag"] == "v2.0.3"
          assert capabilities["build_commit"] == __import__("os").environ["GITHUB_SHA"]
          assert capabilities["bundled"]["ffmpeg"] == manifest["ffmpeg"]
          assert capabilities["bundled"]["font"] == manifest["font"]
          assert capabilities["global_python_required"] is False
          assert capabilities["global_ffmpeg_required"] is False

          assert smoke["ok"] is True
          assert smoke["api_key_present"] is False
          assert "audio" in smoke["output_streams"]
          assert "video" in smoke["output_streams"]
          assert f"v{version}" in smoke["gui_title"]

          ffmpeg = manifest["ffmpeg"]
          assert ffmpeg["sha256"] in notices
          assert ffmpeg["asset_name"] in notices
          assert ffmpeg["release_tag"] in notices
          assert manifest["font"]["commit"] in notices

          evidence = {
              "status": "PASS",
              "candidate_sha": __import__("os").environ["GITHUB_SHA"],
              "version": version,
              "artifact": zip_name,
              "artifact_sha256": zip_sha,
              "artifact_bytes": zip_path.stat().st_size,
              "python": manifest["python"]["version"],
              "ffmpeg_asset": ffmpeg["asset_name"],
              "ffmpeg_sha256": ffmpeg["sha256"],
              "extracted_unicode_apostrophe_smoke": "PASS",
              "global_python_isolation": "PASS",
              "global_ffmpeg_isolation": "PASS",
              "api_key_absent": "PASS",
              "audio_video_probe": "PASS",
              "external_filter_script": "PASS",
              "publication_performed": False,
              "q5_required": True,
              "stable_v202_immutable": True,
          }
          out = root / "q4-artifact-evidence"
          out.mkdir(exist_ok=True)
          (out / "summary.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          (out / "portable-smoke.json").write_text(json.dumps(smoke, indent=2) + "\n", encoding="utf-8")
          (out / "CAPABILITIES.json").write_text(json.dumps(capabilities, indent=2) + "\n", encoding="utf-8")
          (out / "RELEASE_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Q4 exact artifact identity/content gate gagal." }

      - name: Record pinned Windows FFmpeg version
        shell: pwsh
        run: |
          & 'tools\ffmpeg\ffmpeg.exe' -version 2>&1 | Out-File 'q4-artifact-evidence\ffmpeg-version.txt' -Encoding utf8
          'PASS: pinned Windows FFmpeg executed -/filter_complex.' | Set-Content 'q4-artifact-evidence\external-filter-script.txt' -Encoding utf8
          Copy-Item SHA256SUMS.txt q4-artifact-evidence\SHA256SUMS.txt
          Copy-Item THIRD_PARTY_NOTICES.md q4-artifact-evidence\THIRD_PARTY_NOTICES.md

      - name: Upload exact Q4 candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: q4-v2.0.3-windows-artifact-candidate
          path: |
            Full-Album-Maker-v2.0.3-Windows-Portable.zip
            SHA256SUMS.txt
            q4-artifact-evidence/**
          if-no-files-found: error
