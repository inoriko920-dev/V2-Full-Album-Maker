name: One-off full repository recovery backup
on:
  push:
    branches:
      - backup/v2-full-album-maker-20261011
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Export verified entire Git history and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export/GIT" "$RUNNER_TEMP/export/SOURCE" "$RUNNER_TEMP/export/INDEX"
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/repo.git"
          git -C "$RUNNER_TEMP/repo.git" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/repo.git" fsck --full --no-reflogs
          git -C "$RUNNER_TEMP/repo.git" bundle create "$RUNNER_TEMP/export/GIT/V2-Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle" --all
          git -C "$RUNNER_TEMP/repo.git" bundle verify "$RUNNER_TEMP/export/GIT/V2-Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle" |& tee "$RUNNER_TEMP/export/INDEX/BUNDLE_VERIFY.txt"
          git bundle list-heads "$RUNNER_TEMP/export/GIT/V2-Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle" > "$RUNNER_TEMP/export/INDEX/BUNDLE_REFS.txt"
          git -C "$RUNNER_TEMP/repo.git" archive --format=zip --output="$RUNNER_TEMP/export/SOURCE/V2-Full-Album-Maker-SOURCE-MAIN.zip" refs/heads/main
          git -C "$RUNNER_TEMP/repo.git" archive --format=zip --output="$RUNNER_TEMP/export/SOURCE/V2-Full-Album-Maker-DOCS-AND-ASSETS.zip" refs/heads/main docs assets
          git -C "$RUNNER_TEMP/repo.git" for-each-ref --format='%(refname) %(objectname)' refs/heads > "$RUNNER_TEMP/export/INDEX/BRANCHES.txt"
          git -C "$RUNNER_TEMP/repo.git" for-each-ref --format='%(refname) %(objectname)' refs/tags > "$RUNNER_TEMP/export/INDEX/TAGS.txt"
          git -C "$RUNNER_TEMP/repo.git" log --all --date=iso-strict --format='%H|%aI|%an|%s' > "$RUNNER_TEMP/export/INDEX/COMMIT_HISTORY.txt"
          git -C "$RUNNER_TEMP/repo.git" rev-list --all --count > "$RUNNER_TEMP/export/INDEX/COMMIT_COUNT.txt"
          git -C "$RUNNER_TEMP/repo.git" rev-parse refs/heads/main > "$RUNNER_TEMP/export/INDEX/MAIN_COMMIT.txt"
          git -C "$RUNNER_TEMP/repo.git" ls-tree -r --name-only refs/heads/main > "$RUNNER_TEMP/export/INDEX/MAIN_FILE_LIST.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/export/INDEX/GITHUB_RELEASES.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" > "$RUNNER_TEMP/export/INDEX/GITHUB_PULL_REQUESTS.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" > "$RUNNER_TEMP/export/INDEX/GITHUB_ISSUES.json"
          find "$RUNNER_TEMP/export" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/export/INDEX/UPSTREAM_SHA256SUMS.txt"
          test -s "$RUNNER_TEMP/export/GIT/V2-Full-Album-Maker-COMPLETE-GIT-HISTORY.bundle"
          test -s "$RUNNER_TEMP/export/SOURCE/V2-Full-Album-Maker-SOURCE-MAIN.zip"
          echo "GIT_EXPORT_PASSED"
      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2-Full-Album-Maker-full-recovery-20261011
          path: ${{ runner.temp }}/export/
          retention-days: 30
          if-no-files-found: error
